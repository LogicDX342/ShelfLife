name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write

    runs-on: windows-latest
    env:
      DIST_DIR: ${{ github.workspace }}\dist
      PACKAGE_PATH: ${{ github.workspace }}\release\ShelfLife.msix
      WINAPP_CLI_UPDATE_CHECK: '0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup WinApp CLI
        uses: microsoft/setup-WinAppCli@v0.2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release verification
        run: pnpm verify

      - name: Stamp manifest version
        shell: pwsh
        run: |
          $package = Get-Content -Raw package.json | ConvertFrom-Json
          $parts = @($package.version.Split('.'))

          if ($parts.Count -gt 3) {
            throw "package.json version '$($package.version)' cannot be converted to a four-part MSIX version."
          }

          $identityVersion = ($parts + @('0', '0', '0'))[0..3] -join '.'
          [xml]$manifest = Get-Content -Raw Package.appxmanifest
          $namespace = New-Object System.Xml.XmlNamespaceManager($manifest.NameTable)
          $namespace.AddNamespace('pkg', 'http://schemas.microsoft.com/appx/manifest/foundation/windows10')
          $identity = $manifest.SelectSingleNode('/pkg:Package/pkg:Identity', $namespace)

          if ($null -eq $identity) {
            throw "Package.appxmanifest does not contain a Package/Identity element."
          }

          $identity.SetAttribute('Version', $identityVersion)
          $manifest.Save((Resolve-Path Package.appxmanifest))
          Write-Host "Stamped Package.appxmanifest Identity Version=$identityVersion"

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ShelfLife ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download this version.'
          generateReleaseNotes: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          releaseAssetNamePattern: '[name]_[version]_[arch][setup][ext]'

      - name: Stage MSIX contents
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path (Join-Path $env:DIST_DIR 'src-tauri\icons') | Out-Null
          Copy-Item -Path src-tauri\target\release\shelflife.exe -Destination (Join-Path $env:DIST_DIR 'shelflife.exe') -Force
          Copy-Item -Path src-tauri\icons\assets -Destination (Join-Path $env:DIST_DIR 'src-tauri\icons\assets') -Recurse -Force

      - name: Package MSIX
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path (Split-Path $env:PACKAGE_PATH) | Out-Null
          winapp pack $env:DIST_DIR --manifest Package.appxmanifest --executable shelflife.exe --output $env:PACKAGE_PATH

          if (-not (Test-Path $env:PACKAGE_PATH)) {
            Get-ChildItem -Recurse -Filter *.msix | Format-Table -AutoSize
            throw "Expected MSIX was not created at $env:PACKAGE_PATH."
          }

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: ShelfLife-msix
          path: ${{ env.PACKAGE_PATH }}
          if-no-files-found: error

      - name: Configure Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Reconfigure Store credentials
        shell: pwsh
        run: |
          msstore reconfigure `
            --tenantId ${{ secrets.AZURE_AD_TENANT_ID }} `
            --sellerId ${{ secrets.SELLER_ID }} `
            --clientId ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }} `
            --clientSecret ${{ secrets.AZURE_AD_APPLICATION_SECRET }}

      - name: Publish MSIX to Microsoft Store
        shell: pwsh
        run: msstore publish "$env:PACKAGE_PATH" -id "${{ vars.MICROSOFT_STORE_PRODUCT_ID }}"
